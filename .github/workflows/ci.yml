name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `edited` re-checks the title and body, which end up in the squashed commit message.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Apple Silicon, macOS 26: the only platform NooVeu supports.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Project rules, files
        run: scripts/check-names.sh

      - name: Project rules, commits and pull request text
        if: github.event_name == 'pull_request'
        env:
          # Passed through the environment, never interpolated into the script.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          scripts/check-names.sh --commits "origin/${BASE_REF}..HEAD"
          printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" | scripts/check-names.sh --stdin

      - name: Build
        run: swift build

      - name: Test
        run: scripts/test.sh

      - name: Bundle the app
        run: scripts/bundle-app.sh

      - name: Check the bundle
        run: |
          plutil -lint build/NooVeu.app/Contents/Info.plist
          codesign --verify --strict build/NooVeu.app
          test -f build/NooVeu.app/Contents/Resources/AppIcon.icns

  benchmark:
    # Informational only. A GitHub-hosted runner is an M1-class virtual machine: the lowest-end Apple
    # silicon available for measuring, and a noisy one (shared hardware, few cores). Its numbers
    # show roughly how a slower Mac behaves. A missed target never fails the build; a failure to
    # build or to produce a report is still shown (the report step is marked as failed).
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build the benchmark
        run: swift build -c release --product nooveu-bench

      - name: Generate the test corpus
        run: .build/release/nooveu-bench corpus Corpus/generated

      - name: Run the benchmark
        # Without --enforce, so a miss is reported, not fatal. `shell: bash` makes GitHub use
        # `-o pipefail`: without it `tee` would hide a benchmark that crashed.
        shell: bash
        continue-on-error: true
        run: .build/release/nooveu-bench run Corpus/generated --iterations 5 --json bench.json | tee bench.txt

      - name: Summarise
        if: always()
        run: |
          {
            echo "## Benchmark on the CI runner (informational)"
            echo
            echo "$(sysctl -n machdep.cpu.brand_string), $(sysctl -n hw.ncpu) cores, $(( $(sysctl -n hw.memsize) / 1073741824 )) GB. Shared virtual hardware: expect noise."
            echo
            echo '```'
            if [ -f bench.txt ] && grep -q '^Targets' bench.txt; then
              sed -n '/^Targets/,$p' bench.txt
            else
              echo "the benchmark did not produce a report"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark
          path: |
            bench.json
            bench.txt
          if-no-files-found: ignore
